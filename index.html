<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quản Lý Chi Tiêu</title>
    <!-- SDK FIREBASE -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    
    <style>
        /* =========================================
           1. BIẾN MÀU SẮC & THIẾT LẬP CƠ BẢN
           ========================================= */
        :root {
            --primary: #4361ee; --success: #2ecc71; --success-light: #e8f8f0;
            --danger: #e74c3c; --danger-light: #fceceb; --warning: #f39c12;
            --bg-color: #f4f6f9; --card-bg: #ffffff;
            --text-main: #2b2d42; --text-muted: #8d99ae;
            --border-radius-lg: 16px; --border-radius-md: 12px; --touch-size: 48px;
            
            --c-food: #ff9f43; --c-food-bg: #fff5ec;
            --c-transport: #0abde3; --c-transport-bg: #e6f8fc;
            --c-shopping: #f368e0; --c-shopping-bg: #fef0fc;
            --c-bill: #5f27cd; --c-bill-bg: #efebf9;
            --c-sales: #10ac84; --c-sales-bg: #e7f7f3;
            --c-other: #8395a7; --c-other-bg: #f2f4f6;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 480px; min-height: 100vh; padding: 20px 16px 40px 16px; display: flex; flex-direction: column; gap: 20px; position: relative;}

        /* =========================================
           2. SPLASH SCREEN & AUTH OVERLAY
           ========================================= */
        .splash-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color); z-index: 99999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }
        .splash-screen.hide { opacity: 0; visibility: hidden; pointer-events: none; }

        .auth-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color); z-index: 10000;
            display: flex; align-items: center; justify-content: center;
            padding: 20px; transition: opacity 0.3s, visibility 0.3s;
        }
        .auth-overlay.hide { opacity: 0; visibility: hidden; pointer-events: none; }
        
        .auth-card {
            background: #fff; width: 100%; max-width: 360px; padding: 40px 24px;
            border-radius: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); text-align: center;
        }
        .auth-logo { 
            width: 72px; height: 72px; background: linear-gradient(135deg, var(--primary) 0%, #2a5298 100%); 
            color: #fff; border-radius: 24px; display: flex; align-items: center; justify-content: center; 
            margin: 0 auto 24px auto; box-shadow: 0 8px 16px rgba(67, 97, 238, 0.25); 
        }
        .auth-logo svg { width: 36px; height: 36px; stroke: currentColor; fill: none; stroke-width: 2;}
        .auth-title { font-size: 22px; font-weight: 800; color: var(--text-main); margin-bottom: 28px; }
        
        .auth-input-group { position: relative; margin-bottom: 16px; }
        .auth-input-group svg {
            position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
            width: 20px; height: 20px; color: var(--text-muted); transition: 0.2s;
        }
        .auth-form-control {
            width: 100%; height: 52px; border: 1px solid #e2e8f0; border-radius: 16px;
            padding: 0 16px 0 48px; font-size: 15px; font-weight: 500; outline: none; 
            transition: 0.2s; background: var(--bg-color); color: var(--text-main);
        }
        .auth-form-control:focus { border-color: var(--primary); background: #fff; box-shadow: 0 0 0 4px rgba(67,97,238,0.1); }
        .auth-input-group:focus-within svg { color: var(--primary); }
        
        .auth-options { display: flex; justify-content: flex-start; align-items: center; margin-bottom: 24px; font-size: 14px; }
        .checkbox-group { display: flex; align-items: center; gap: 8px; cursor: pointer; color: var(--text-muted); font-weight: 500;}
        
        .btn-login { 
            width: 100%; height: 52px; background: var(--primary); color: #fff; border: none; 
            border-radius: 16px; font-size: 16px; font-weight: 700; cursor: pointer; transition: 0.2s; 
            box-shadow: 0 4px 12px rgba(67,97,238,0.25); display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-login:active { transform: scale(0.98); }
        .btn-login svg { width: 20px; height: 20px; }
        
        .btn-cancel { background: #f1f3f5; color: var(--text-main); margin-bottom: 0; box-shadow: none;}
        .btn-cancel:active { background: #e2e8f0; }

        /* =========================================
           3. TOAST NOTIFICATION & HEADER AVATAR
           ========================================= */
        .toast {
            position: fixed; top: 20px; right: 20px; transform: translateX(150%);
            background: rgba(43, 45, 66, 0.95); color: #fff; padding: 12px 24px;
            border-radius: 12px; font-size: 14px; font-weight: 600; box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            z-index: 100001; transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex; align-items: center; gap: 8px;
        }
        .toast.show { transform: translateX(0); }
        .toast.success { background: var(--success); }
        .toast.error { background: var(--danger); }

        .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; position: relative; z-index: 50;}
        .top-nav h1 { margin: 0; font-size: 20px; font-weight: 800; color: var(--text-main); }
        
        /* User Avatar & Dropdown */
        .user-menu { position: relative; }
        .avatar-btn {
            width: 40px; height: 40px; border-radius: 50%; border: 2px solid #e2e8f0; 
            overflow: hidden; cursor: pointer; padding: 0; background: #fff;
            transition: 0.2s; display: flex; align-items: center; justify-content: center;
        }
        .avatar-btn:active { transform: scale(0.95); }
        .avatar-btn img { width: 100%; height: 100%; object-fit: cover; }
        
        .dropdown-menu {
            position: absolute; top: 50px; right: 0; width: 180px; background: #fff;
            border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border: 1px solid #f1f3f5;
            opacity: 0; visibility: hidden; transform: translateY(-10px); transition: 0.2s; overflow: hidden;
        }
        .dropdown-menu.show { opacity: 1; visibility: visible; transform: translateY(0); }
        
        .dropdown-header { padding: 12px 16px; border-bottom: 1px solid #f1f3f5; background: #f8f9fa; }
        .dropdown-name { font-size: 13px; font-weight: 700; color: var(--text-main); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
        
        .dropdown-item {
            width: 100%; text-align: left; padding: 12px 16px; border: none; background: #fff;
            font-size: 14px; font-weight: 600; color: var(--text-main); cursor: pointer;
            display: flex; align-items: center; gap: 10px; transition: 0.2s;
        }
        .dropdown-item:active { background: #f8f9fa; }
        .dropdown-item svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2;}
        .dropdown-item.text-danger { color: var(--danger); }

        /* =========================================
           4. BẢNG TỔNG QUAN
           ========================================= */
        .wallet-card {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            border-radius: 20px; padding: 24px; color: #fff;
            box-shadow: 0 16px 32px rgba(30, 60, 114, 0.25);
            position: relative; overflow: hidden; z-index: 10;
        }
        .wallet-card::after { content: ''; position: absolute; top: -50px; right: -30px; width: 150px; height: 150px; background: rgba(255,255,255,0.08); border-radius: 50%; }
        .wallet-card::before { content: ''; position: absolute; bottom: -30px; left: -30px; width: 100px; height: 100px; background: rgba(255,255,255,0.08); border-radius: 50%; }
        .card-header { display: flex; justify-content: space-between; align-items: center; font-size: 14px; opacity: 0.9; margin-bottom: 12px; z-index: 1; position: relative; font-weight: 600; }
        .btn-eye { background: rgba(255,255,255,0.15); border: none; color: #fff; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); transition: 0.2s; }
        .btn-eye:active { transform: scale(0.9); }
        .btn-eye svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2;}
        .card-balance { font-size: 34px; font-weight: 800; margin-bottom: 24px; letter-spacing: -0.5px; z-index: 1; position: relative;}
        .card-stats { display: flex; justify-content: space-between; z-index: 1; position: relative; background: rgba(255,255,255,0.15); padding: 14px 16px; border-radius: 14px; backdrop-filter: blur(8px); }
        .stat-col { display: flex; flex-direction: column; gap: 4px; }
        .stat-col:last-child { text-align: right; }
        .stat-label { font-size: 12px; opacity: 0.85; display: flex; align-items: center; gap: 4px;}
        .stat-val { font-size: 16px; font-weight: 700; }
        .stat-val.in { color: #81ecec; } 
        .stat-val.out { color: #fab1a0; }

        /* =========================================
           5. FORM NHẬP LIỆU
           ========================================= */
        .card { background: var(--card-bg); border-radius: var(--border-radius-lg); padding: 20px; box-shadow: 0 8px 24px rgba(149, 157, 165, 0.1); transition: all 0.3s ease; }
        .card.edit-mode { border: 2px solid var(--warning); box-shadow: 0 8px 24px rgba(243, 156, 18, 0.15); }

        .type-toggle { display: flex; gap: 12px; margin-bottom: 16px; flex-direction: row; }
        .btn-toggle { flex: 1; height: var(--touch-size); border: none; border-radius: var(--border-radius-md); font-size: 16px; font-weight: 600; background: var(--bg-color); color: var(--text-muted); cursor: pointer; transition: 0.2s; }
        .btn-toggle.active.income { background: var(--success); color: white; box-shadow: 0 4px 12px rgba(46, 204, 113, 0.3); }
        .btn-toggle.active.expense { background: var(--danger); color: white; box-shadow: 0 4px 12px rgba(231, 76, 60, 0.3); }

        .form-group { margin-bottom: 16px; position: relative; }
        .form-control { width: 100%; height: var(--touch-size); padding: 0 16px; border: 1px solid #e2e8f0; border-radius: var(--border-radius-md); font-size: 16px; font-weight: 600; outline: none; transition: 0.2s; background: #fff; }
        .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(67,97,238,0.1); }
        
        .modern-date-wrapper { position: relative; display: flex; align-items: center; gap: 12px; background: #fff; border: 1px solid #e2e8f0; border-radius: var(--border-radius-md); height: var(--touch-size); padding: 0 16px; overflow: hidden; transition: 0.2s; }
        .modern-date-wrapper:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(67,97,238,0.1); }
        .modern-date-wrapper svg { width: 20px; height: 20px; color: var(--primary); flex-shrink: 0; }
        .modern-date-wrapper .date-text { font-size: 16px; font-weight: 600; color: var(--text-main); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .modern-date-wrapper input[type="date"] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }

        .amount-wrapper { position: relative; display: flex; align-items: center; }
        .amount-currency { position: absolute; right: 16px; font-weight: 700; color: var(--text-muted); font-size: 16px; }
        .form-control.input-amount { font-size: 20px; font-weight: 700; color: var(--text-main); padding-right: 40px; }

        .quick-amounts { display: flex; gap: 8px; margin-top: 8px; overflow-x: auto; padding-bottom: 4px; }
        .quick-amounts::-webkit-scrollbar { display: none; }
        .btn-quick { flex-shrink: 0; background: #f1f3f5; border: none; padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; color: var(--text-main); cursor: pointer; transition: 0.2s; }
        .btn-quick:active { background: #e2e8f0; transform: scale(0.95); }

        .category-scroll { display: flex; gap: 10px; overflow-x: auto; padding: 4px 0 8px 0; }
        .category-scroll::-webkit-scrollbar { display: none; }
        .cat-pill { flex-shrink: 0; display: flex; align-items: center; gap: 6px; padding: 10px 16px; background: #fff; border: 1.5px solid #e2e8f0; border-radius: 24px; font-size: 14px; font-weight: 600; color: var(--text-muted); cursor: pointer; transition: 0.2s; }
        .cat-pill svg { width: 18px; height: 18px; stroke: currentColor; } 
        .cat-pill.hide { display: none; }
        
        .cat-pill.active[data-val="Ăn uống"] { border-color: var(--c-food); background: var(--c-food-bg); color: var(--c-food); }
        .cat-pill.active[data-val="Đi lại"] { border-color: var(--c-transport); background: var(--c-transport-bg); color: var(--c-transport); }
        .cat-pill.active[data-val="Mua sắm"] { border-color: var(--c-shopping); background: var(--c-shopping-bg); color: var(--c-shopping); }
        .cat-pill.active[data-val="Hóa đơn"] { border-color: var(--c-bill); background: var(--c-bill-bg); color: var(--c-bill); }
        .cat-pill.active[data-val="Tiền bán hàng"] { border-color: var(--c-sales); background: var(--c-sales-bg); color: var(--c-sales); }
        .cat-pill.active[data-val="Khác"] { border-color: var(--c-other); background: var(--c-other-bg); color: var(--text-main); }

        #noteInput { font-size: 15px; font-weight: 500; }
        #noteInput::placeholder { font-weight: 400; color: #a0aec0; }
        
        .btn-submit { width: 100%; height: var(--touch-size); background: var(--primary); color: white; border: none; border-radius: var(--border-radius-md); font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 8px; transition: 0.2s; box-shadow: 0 4px 12px rgba(67, 97, 238, 0.25);}
        .btn-submit:active { transform: scale(0.98); }
        .btn-submit.edit-mode { background: var(--warning); box-shadow: 0 4px 12px rgba(243, 156, 18, 0.25); color: #fff;}

        /* Nút Mở Lịch Sử */
        .btn-open-history { width: 100%; height: 56px; background: var(--card-bg); border-radius: var(--border-radius-lg); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; box-shadow: 0 4px 12px rgba(149, 157, 165, 0.08); border: none; font-size: 16px; font-weight: 600; cursor: pointer; color: var(--text-main); transition: 0.2s; }
        .btn-open-history:active { transform: scale(0.98); }
        .btn-open-history .left-group { display: flex; align-items: center; gap: 12px; }
        .btn-open-history .icon-box { width: 36px; height: 36px; background: #eef2ff; color: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; }

        /* =========================================
           6. POPUP LỊCH SỬ GIAO DỊCH (MODAL)
           ========================================= */
        .history-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 900; opacity: 0; visibility: hidden; transition: 0.3s ease; }
        .history-overlay.show { opacity: 1; visibility: visible; }
        
        .history-modal { position: fixed; bottom: 0; left: 0; width: 100%; height: 90vh; background: var(--bg-color); border-radius: 24px 24px 0 0; z-index: 901; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 -4px 24px rgba(0,0,0,0.1); }
        .history-modal.show { transform: translateY(0); }
        
        .history-modal-header { display: flex; justify-content: space-between; align-items: center; padding: 20px; background: #fff; border-bottom: 1px solid #e2e8f0; z-index: 2; }
        .history-modal-header h3 { font-size: 18px; font-weight: 700; margin: 0;}
        .btn-close-modal { background: #f1f3f5; border: none; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-main); font-size: 20px; }
        .btn-close-modal:active { background: #e2e8f0; }

        .history-modal-body { flex: 1; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 16px; }

        .filter-row { display: flex; gap: 8px; align-items: center; margin-top: 8px;}
        .history-modal-body .form-control { height: 44px; font-size: 14px; font-weight: 500;}
        .filter-date-wrapper { position: relative; display: flex; align-items: center; justify-content: center; gap: 6px; background: #fff; border: 1px solid #e2e8f0; border-radius: var(--border-radius-md); height: 44px; flex: 1; overflow: hidden; }
        .filter-date-wrapper svg { width: 16px; height: 16px; color: var(--text-muted); }
        .filter-date-wrapper .date-text { font-size: 14px; font-weight: 500; color: var(--text-muted); }
        .filter-date-wrapper.active { border-color: var(--primary); }
        .filter-date-wrapper.active svg { color: var(--primary); }
        .filter-date-wrapper.active .date-text { color: var(--primary); font-weight: 600; }
        .filter-date-wrapper input[type="date"] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        .btn-clear-filter { height: 44px; padding: 0 12px; background: #ffe3e3; color: var(--danger); flex-shrink: 0; border: none; border-radius: var(--border-radius-md); font-weight: 600; font-size: 13px; cursor: pointer; }
        
        .transaction-list { display: flex; flex-direction: column; gap: 20px; padding-bottom: 40px;}
        .date-group { display: flex; flex-direction: column; gap: 8px; animation: slideIn 0.3s ease forwards; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .date-group-header { display: flex; justify-content: space-between; align-items: flex-end; padding: 0 4px 4px 4px; position: sticky; top: 0; z-index: 10; background-color: rgba(244, 246, 249, 0.95); backdrop-filter: blur(4px); }
        .date-title { font-weight: 700; color: var(--text-muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
        .date-summary { font-size: 13px; font-weight: 600; color: var(--text-muted); }
        .date-group-items { background: var(--card-bg); border-radius: var(--border-radius-lg); box-shadow: 0 4px 15px rgba(0,0,0,0.03); overflow: hidden; }

        .transaction-item { display: flex; align-items: center; justify-content: space-between; padding: 16px; cursor: pointer; transition: background-color 0.2s; border-bottom: 1px solid #f1f3f5; }
        .transaction-item:last-child { border-bottom: none; }
        .transaction-item:active { background: #f8f9fa; }
        .t-left { display: flex; align-items: center; flex: 1; gap: 14px; overflow: hidden; }
        .t-icon { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .t-icon svg { width: 20px; height: 20px; stroke: currentColor; } 
        
        .t-icon[data-cat="Ăn uống"] { background-color: var(--c-food-bg); color: var(--c-food); }
        .t-icon[data-cat="Đi lại"] { background-color: var(--c-transport-bg); color: var(--c-transport); }
        .t-icon[data-cat="Mua sắm"] { background-color: var(--c-shopping-bg); color: var(--c-shopping); }
        .t-icon[data-cat="Hóa đơn"] { background-color: var(--c-bill-bg); color: var(--c-bill); }
        .t-icon[data-cat="Tiền bán hàng"] { background-color: var(--c-sales-bg); color: var(--c-sales); }
        .t-icon[data-cat="Khác"] { background-color: var(--c-other-bg); color: var(--text-main); }
        
        .t-info { display: flex; flex-direction: column; justify-content: center; overflow: hidden; }
        .t-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; color: var(--text-main); }
        .t-note { font-size: 13px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .t-action { display: flex; align-items: center; gap: 10px; flex-shrink: 0; margin-left: 12px; }
        .t-amount { font-weight: 700; font-size: 15px; }
        .t-chevron { color: #cbd5e1; font-size: 20px; font-weight: 300; margin-top: -2px;} 
        .btn-load-more { width: 100%; height: var(--touch-size); background: #eef2ff; color: var(--primary); border: none; border-radius: var(--border-radius-md); font-weight: 600; margin-top: 8px; cursor: pointer; }

        /* =========================================
           7. ACTION SHEET (BOTTOM MENU)
           ========================================= */
        .sheet-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 998; opacity: 0; visibility: hidden; transition: 0.3s ease; }
        .sheet-overlay.show { opacity: 1; visibility: visible; }
        .bottom-sheet { position: fixed; bottom: 0; left: 0; width: 100%; background: #fff; border-radius: 24px 24px 0 0; padding: 24px 20px 40px 20px; transform: translateY(100%); z-index: 999; transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); display: flex; flex-direction: column; gap: 12px; box-shadow: 0 -4px 24px rgba(0,0,0,0.1); }
        .bottom-sheet.show { transform: translateY(0); }
        .sheet-header { text-align: center; font-weight: 700; font-size: 16px; margin-bottom: 8px; color: var(--text-muted);}
        .sheet-indicator { width: 40px; height: 4px; background: #e2e8f0; border-radius: 4px; margin: 0 auto 16px auto; }
        .sheet-btn { width: 100%; height: 56px; border-radius: 16px; border: none; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; }
        .sheet-btn svg { width: 20px; height: 20px; }
        .btn-sheet-edit { background: #eef2ff; color: var(--primary); }
        .btn-sheet-delete { background: var(--danger-light); color: var(--danger); }
        .btn-sheet-cancel { background: #f1f3f5; color: var(--text-main); margin-top: 8px; }
        .hide { display: none !important; }
        .loading-text { text-align: center; color: var(--primary); font-weight: 600; padding: 20px; }
    </style>
</head>
<body>

<!-- MÀN HÌNH SPLASH CHỜ LOAD DỮ LIỆU ĐỂ TRÁNH NHÁY MÀN HÌNH -->
<div id="splashScreen" class="splash-screen">
    <div class="auth-logo">

<script>
    // ==========================================
    // 1. FIREBASE INIT
    // ==========================================
    const firebaseConfig = {
        apiKey: "AIzaSyDTQeojG01YfuQEqA5SQNL0UaFB6mMTKVQ",
        authDomain: "quanlytaichinh-2fdb9.firebaseapp.com",
        databaseURL: "https://quanlytaichinh-2fdb9-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "quanlytaichinh-2fdb9",
        storageBucket: "quanlytaichinh-2fdb9.firebasestorage.app",
        messagingSenderId: "434569527448",
        appId: "1:434569527448:web:a4667beb66a570bcaed0ed"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const auth = firebase.auth();
    let txRef = null;
    let currentUser = null;

    // ==========================================
    // 2. SVG ICONS & FORMATTERS
    // ==========================================
    const svgIcons = {
        'Ăn uống': `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8h1a4 4 0 0 1 0 8h-1"></path><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path><line x1="6" y1="1" x2="6" y2="4"></line><line x1="10" y1="1" x2="10" y2="4"></line><line x1="14" y1="1" x2="14" y2="4"></line></svg>`,
        'Đi lại': `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="12" width="20" height="8" rx="2" ry="2"></rect><polygon points="2 12 5 7 19 7 22 12"></polygon><circle cx="6" cy="20" r="2"></circle><circle cx="18" cy="20" r="2"></circle></svg>`,
        'Mua sắm': `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>`,
        'Hóa đơn': `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>`,
        'Tiền bán hàng': `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path><line x1="7" y1="7" x2="7.01" y2="7"></line></svg>`,
        'Khác': `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>`
    };

    const formatter = new Intl.NumberFormat('vi-VN'); 
    const currencyFormatter = new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' });

    let toastTimeout;
    function showToast(message, type = 'success') {
        const toast = document.getElementById('toastMsg');
        toast.innerHTML = type === 'success' ? `✓ ${message}` : `⚠ ${message}`;
        toast.className = `toast show ${type}`;
        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => { toast.classList.remove('show'); }, 3000);
    }

    function getFormattedDate() {
        const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }
    const todayStr = getFormattedDate();
    function formatNiceDate(ymdStr) {
        if(!ymdStr) return ''; const [y, m, d] = ymdStr.split('-'); return (ymdStr === todayStr) ? `Hôm nay, ${d}/${m}/${y}` : `${d}/${m}/${y}`;
    }

    function getAuthErrorVN(code) {
        switch(code) {
            case 'auth/invalid-email': return 'Tên đăng nhập không hợp lệ!';
            case 'auth/wrong-password': return 'Sai mật khẩu!';
            case 'auth/user-not-found': return 'Tài khoản không tồn tại!';
            case 'auth/invalid-credential': return 'Thông tin đăng nhập không chính xác!';
            case 'auth/requires-recent-login': return 'Vì lý do bảo mật, vui lòng đăng xuất và đăng nhập lại trước khi đổi mật khẩu.';
            default: return 'Có lỗi xảy ra. Vui lòng thử lại!';
        }
    }

    // ==========================================
    // 3. LOGIC AUTH & AVATAR MENU
    // ==========================================
    let transactions = [];
    let editingId = null; 
    let selectedSheetId = null;
    const DATES_PER_PAGE = 3; 
    let currentDateLimit = DATES_PER_PAGE;
    let isBalanceHidden = true; 
    let currentBalances = { total: 0, income: 0, expense: 0 };
    
    let isFirstLoad = true;

    // Tự động điền mật khẩu đã lưu
    window.addEventListener('DOMContentLoaded', () => {
        if(localStorage.getItem('savedUsername')) {
            document.getElementById('usernameInput').value = localStorage.getItem('savedUsername');
            document.getElementById('passwordInput').value = localStorage.getItem('savedPassword');
            document.getElementById('rememberMe').checked = true;
        }
    });

    // Lắng nghe trạng thái đăng nhập
    auth.onAuthStateChanged(user => {
        if (user) {
            currentUser = user;
            document.getElementById('authOverlay').classList.add('hide'); 
            
            // Xử lý tạo Avatar
            const username = user.email.split('@')[0];
            document.getElementById('dropdownName').innerText = 'Xin chào, ' + username;
            document.getElementById('avatarImg').src = `https://ui-avatars.com/api/?name=${username}&background=4361ee&color=fff&bold=true`;

            // Tải dữ liệu Firebase
            txRef = db.ref(`users/${currentUser.uid}/transactions`);
            txRef.on('value', (snapshot) => {
                const data = snapshot.val();
                let loadedTransactions = [];
                if (data) {
                    for (let dateKey in data) {
                        for (let txId in data[dateKey]) {
                            loadedTransactions.push({ id: Number(txId), date: dateKey, ...data[dateKey][txId] });
                        }
                    }
                }
                transactions = loadedTransactions;
                updateUI();
            });
        } else {
            currentUser = null;
            document.getElementById('authOverlay').classList.remove('hide'); 
            transactions = []; updateUI();
        }
        
        // Tắt Splash screen
        if (isFirstLoad) {
            document.getElementById('splashScreen').classList.add('hide');
            isFirstLoad = false;
        }
    });

    // Xử lý nút Đăng nhập
    document.getElementById('btnLogin').addEventListener('click', () => {
        const username = document.getElementById('usernameInput').value.trim();
        const pwd = document.getElementById('passwordInput').value;
        const remember = document.getElementById('rememberMe').checked;
        if(!username || !pwd) { showToast('Vui lòng nhập đủ thông tin', 'error'); return; }

        const email = username.includes('@') ? username : `${username}@chitieu.com`;

        if(remember) {
            localStorage.setItem('savedUsername', username);
            localStorage.setItem('savedPassword', pwd);
        } else {
            localStorage.removeItem('savedUsername');
            localStorage.removeItem('savedPassword');
        }

        const persistence = remember ? firebase.auth.Auth.Persistence.LOCAL : firebase.auth.Auth.Persistence.SESSION;
        auth.setPersistence(persistence)
            .then(() => auth.signInWithEmailAndPassword(email, pwd))
            .then(() => { showToast('Đăng nhập thành công!'); })
            .catch(err => showToast(getAuthErrorVN(err.code), 'error'));
    });

    // Toggle Dropdown Menu Avatar
    const btnAvatar = document.getElementById('btnAvatar');
    const dropdownMenu = document.getElementById('dropdownMenu');
    
    btnAvatar.addEventListener('click', (e) => {
        e.stopPropagation();
        dropdownMenu.classList.toggle('show');
    });

    // Đóng dropdown khi click ra ngoài
    document.addEventListener('click', (e) => {
        if(!dropdownMenu.contains(e.target) && e.target !== btnAvatar) {
            dropdownMenu.classList.remove('show');
        }
    });

    // Đăng xuất từ menu dropdown
    document.getElementById('btnLogout').addEventListener('click', () => {
        dropdownMenu.classList.remove('show');
        if(confirm('Bạn muốn đăng xuất?')) {
            auth.signOut().then(() => { if(txRef) txRef.off(); showToast('Đã đăng xuất'); });
        }
    });

    // Xử lý Popup Đổi Mật Khẩu
    const changePwdOverlay = document.getElementById('changePwdOverlay');
    
    document.getElementById('btnOpenChangePwd').addEventListener('click', () => {
        dropdownMenu.classList.remove('show');
        changePwdOverlay.classList.remove('hide');
    });

    document.getElementById('btnCancelChangePwd').addEventListener('click', () => {
        changePwdOverlay.classList.add('hide');
        document.getElementById('newPasswordInput').value = '';
    });

    document.getElementById('btnSubmitChangePwd').addEventListener('click', () => {
        const newPwd = document.getElementById('newPasswordInput').value;
        if(newPwd.length < 6) { showToast('Mật khẩu phải từ 6 ký tự!', 'error'); return; }

        currentUser.updatePassword(newPwd).then(() => {
            showToast('Đổi mật khẩu thành công!');
            changePwdOverlay.classList.add('hide');
            document.getElementById('newPasswordInput').value = '';
            // Cập nhật pass đã lưu nếu đang dùng ghi nhớ
            if(localStorage.getItem('savedUsername')) {
                localStorage.setItem('savedPassword', newPwd);
            }
        }).catch((error) => {
            showToast(getAuthErrorVN(error.code), 'error');
        });
    });


    // ==========================================
    // 4. MẮT (ẨN/HIỆN SỐ DƯ) & MỞ POPUP LỊCH SỬ
    // ==========================================
    document.getElementById('btnToggleEye').addEventListener('click', () => {
        isBalanceHidden = !isBalanceHidden;
        if(isBalanceHidden) {
            document.getElementById('iconEyeOpen').classList.add('hide'); document.getElementById('iconEyeClosed').classList.remove('hide');
        } else {
            document.getElementById('iconEyeOpen').classList.remove('hide'); document.getElementById('iconEyeClosed').classList.add('hide');
        }
        renderBalances();
    });

    function renderBalances() {
        if(isBalanceHidden) {
            document.getElementById('totalBalance').innerText = '******';
            document.getElementById('totalIncome').innerText = '******';
            document.getElementById('totalExpense').innerText = '******';
        } else {
            document.getElementById('totalBalance').innerText = currencyFormatter.format(currentBalances.total);
            document.getElementById('totalIncome').innerText = '+' + currencyFormatter.format(currentBalances.income);
            document.getElementById('totalExpense').innerText = '-' + currencyFormatter.format(currentBalances.expense);
        }
    }

    const historyOverlay = document.getElementById('historyOverlay');
    const historyModal = document.getElementById('historyModal');

    function closeHistoryModal() { historyOverlay.classList.remove('show'); historyModal.classList.remove('show'); }
    
    document.getElementById('btnOpenHistory').addEventListener('click', () => {
        historyOverlay.classList.add('show'); historyModal.classList.add('show');
    });
    document.getElementById('btnCloseHistory').addEventListener('click', closeHistoryModal);
    historyOverlay.addEventListener('click', closeHistoryModal);

    // ==========================================
    // 5. CẢI TIẾN FORM LOGIC
    // ==========================================
    const dateInput = document.getElementById('dateInput');
    const formDateDisplay = document.getElementById('formDateDisplay');
    dateInput.value = todayStr; formDateDisplay.innerText = formatNiceDate(todayStr);

    dateInput.addEventListener('change', (e) => { formDateDisplay.innerText = formatNiceDate(e.target.value); });

    const filterDate = document.getElementById('filterDate');
    const filterDateDisplay = document.getElementById('filterDateDisplay');
    const filterDateWrapper = document.getElementById('filterDateWrapper');

    filterDate.addEventListener('change', (e) => {
        const val = e.target.value;
        if(val) {
            filterDateDisplay.innerText = formatNiceDate(val).replace('Hôm nay, ', '');
            filterDateWrapper.classList.add('active');
        } else {
            filterDateDisplay.innerText = 'Lọc ngày';
            filterDateWrapper.classList.remove('active');
        }
        currentDateLimit = DATES_PER_PAGE; updateUI();
    });

    const amountInputDisplay = document.getElementById('amountInputDisplay');
    const amountInputRaw = document.getElementById('amountInputRaw');

    amountInputDisplay.addEventListener('input', function(e) {
        let val = this.value.replace(/\D/g, '');
        if (val === '') { amountInputRaw.value = ''; this.value = ''; return; }
        amountInputRaw.value = val; this.value = formatter.format(parseInt(val));
    });

    document.querySelectorAll('.btn-quick').forEach(btn => {
        btn.addEventListener('click', () => {
            const addVal = parseInt(btn.getAttribute('data-val'));
            let currentRaw = amountInputRaw.value ? parseInt(amountInputRaw.value) : 0;
            currentRaw += addVal; amountInputRaw.value = currentRaw; amountInputDisplay.value = formatter.format(currentRaw);
        });
    });

    const catPills = document.querySelectorAll('.cat-pill');
    const categoryInput = document.getElementById('categoryInput');

    catPills.forEach(pill => {
        pill.addEventListener('click', () => {
            if(pill.classList.contains('hide')) return;
            catPills.forEach(p => p.classList.remove('active'));
            pill.classList.add('active'); categoryInput.value = pill.getAttribute('data-val');
            pill.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        });
    });

    function switchType(type) {
        document.querySelectorAll('.btn-toggle').forEach(b => b.classList.remove('active', 'income', 'expense'));
        document.querySelector(`.btn-toggle[data-type="${type}"]`).classList.add('active', type);
        document.getElementById('typeInput').value = type;

        document.querySelectorAll('.opt-expense').forEach(opt => opt.classList.toggle('hide', type === 'income'));
        document.querySelectorAll('.opt-income').forEach(opt => opt.classList.toggle('hide', type === 'expense'));
        
        const firstVisiblePill = document.querySelector(`.cat-pill:not(.hide)`);
        if (firstVisiblePill) {
            catPills.forEach(p => p.classList.remove('active'));
            firstVisiblePill.classList.add('active');
            categoryInput.value = firstVisiblePill.getAttribute('data-val');
            document.getElementById('categoryScroll').scrollLeft = 0;
        }
    }
    document.querySelectorAll('.btn-toggle').forEach(btn => { btn.addEventListener('click', () => switchType(btn.getAttribute('data-type'))); });

    // ==========================================
    // 6. UPDATE GIAO DIỆN LỊCH SỬ (POPUP)
    // ==========================================
    ['searchInput', 'filterCategory'].forEach(id => {
        document.getElementById(id).addEventListener('input', () => { currentDateLimit = DATES_PER_PAGE; updateUI(); });
    });
    
    document.getElementById('clearFilterBtn').addEventListener('click', () => {
        filterDate.value = ''; filterDateDisplay.innerText = 'Lọc ngày'; filterDateWrapper.classList.remove('active');
        document.getElementById('searchInput').value = ''; document.getElementById('filterCategory').value = '';
        currentDateLimit = DATES_PER_PAGE; updateUI();
    });

    function updateUI() {
        const fDate = filterDate.value;
        const sText = document.getElementById('searchInput').value.toLowerCase().trim();
        const fCat = document.getElementById('filterCategory').value;
        const listEl = document.getElementById('transactionList');

        // BƯỚC 1: TÍNH TỔNG QUAN VÍ
        const totalIncomeAll = transactions.filter(t => t.type === 'income').reduce((acc, t) => acc + t.amount, 0);
        const totalExpenseAll = transactions.filter(t => t.type === 'expense').reduce((acc, t) => acc + t.amount, 0);
        currentBalances = { total: totalIncomeAll - totalExpenseAll, income: totalIncomeAll, expense: totalExpenseAll };
        renderBalances();

        // BƯỚC 2: RENDER LỊCH SỬ (TRONG POPUP)
        let displayData = [...transactions];
        const isFiltering = fDate || sText || fCat;

        if (isFiltering) {
            document.getElementById('clearFilterBtn').classList.remove('hide');
            displayData = transactions.filter(t => {
                const matchDate = fDate ? t.date === fDate : true;
                const matchCat = fCat ? t.category === fCat : true;
                const matchSearch = sText ? (t.category.toLowerCase().includes(sText) || (t.note && t.note.toLowerCase().includes(sText))) : true;
                return matchDate && matchCat && matchSearch;
            });
        } else {
            document.getElementById('clearFilterBtn').classList.add('hide');
        }

        const grouped = {};
        displayData.forEach(t => {
            const dateStr = t.date; 
            if (!grouped[dateStr]) grouped[dateStr] = { items: [], in: 0, out: 0 };
            grouped[dateStr].items.push(t);
            if (t.type === 'income') grouped[dateStr].in += t.amount;
            if (t.type === 'expense') grouped[dateStr].out += t.amount;
        });

        const sortedDates = Object.keys(grouped).sort().reverse();
        
        listEl.innerHTML = '';
        if(sortedDates.length === 0) {
            listEl.innerHTML = '<p style="text-align:center; color:var(--text-muted); padding: 40px 20px;">Không tìm thấy giao dịch nào.</p>';
            return;
        }

        const paginatedDates = sortedDates.slice(0, currentDateLimit);

        for (const rawDate of paginatedDates) {
            const data = grouped[rawDate];
            const displayDateText = formatNiceDate(rawDate).replace('Hôm nay, ', '');

            const groupDiv = document.createElement('div');
            groupDiv.className = 'date-group';

            const head = document.createElement('div');
            head.className = 'date-group-header';
            head.innerHTML = `
                <div class="date-title">${displayDateText}</div>
                <div class="date-summary">
                    <span class="text-success">+${formatter.format(data.in)}</span> &nbsp;|&nbsp; 
                    <span class="text-danger">-${formatter.format(data.out)}</span>
                </div>
            `;
            groupDiv.appendChild(head);

            const itemsContainer = document.createElement('div');
            itemsContainer.className = 'date-group-items';

            data.items.sort((a, b) => b.id - a.id);

            data.items.forEach(t => {
                const isInc = t.type === 'income';
                const itemDiv = document.createElement('div');
                itemDiv.className = 'transaction-item';
                itemDiv.onclick = () => openActionSheet(t.id, t.category, t.amount);
                
                itemDiv.innerHTML = `
                    <div class="t-left">
                        <div class="t-icon" data-cat="${t.category}">${svgIcons[t.category] || svgIcons['Khác']}</div>
                        <div class="t-info">
                            <div class="t-title">${t.category}</div>
                            <div class="t-note">${t.note || '...'}</div>
                        </div>
                    </div>
                    <div class="t-action">
                        <div class="t-amount ${isInc ? 'text-success' : 'text-danger'}">${isInc ? '+' : '-'}${formatter.format(t.amount)}</div>
                        <div class="t-chevron">›</div>
                    </div>
                `;
                itemsContainer.appendChild(itemDiv);
            });
            
            groupDiv.appendChild(itemsContainer);
            listEl.appendChild(groupDiv);
        }

        if (sortedDates.length > currentDateLimit) {
            const loadMoreBtn = document.createElement('button');
            loadMoreBtn.className = 'btn-load-more';
            loadMoreBtn.innerText = `Xem thêm các ngày trước`;
            loadMoreBtn.onclick = () => { currentDateLimit += DATES_PER_PAGE; updateUI(); };
            listEl.appendChild(loadMoreBtn);
        }
    }

    // ==========================================
    // 7. XỬ LÝ ACTION SHEET (SỬA / XÓA)
    // ==========================================
    const sheetOverlay = document.getElementById('sheetOverlay');
    const actionSheet = document.getElementById('actionSheet');

    function openActionSheet(id, category, amount) {
        selectedSheetId = id;
        document.getElementById('sheetHeaderTitle').innerText = `${category} - ${formatter.format(amount)}đ`;
        sheetOverlay.classList.add('show'); actionSheet.classList.add('show');
    }

    function closeActionSheet() {
        sheetOverlay.classList.remove('show'); actionSheet.classList.remove('show'); selectedSheetId = null;
    }

    sheetOverlay.addEventListener('click', closeActionSheet);
    document.getElementById('btnSheetCancel').addEventListener('click', closeActionSheet);
    
    document.getElementById('btnSheetEdit').addEventListener('click', () => { 
        if(selectedSheetId) triggerEdit(selectedSheetId); closeActionSheet(); 
    });
    
    document.getElementById('btnSheetDelete').addEventListener('click', () => { 
        if(selectedSheetId) triggerDelete(selectedSheetId); closeActionSheet(); 
    });

    function triggerEdit(id) {
        const t = transactions.find(x => x.id === id);
        if(!t) return;
        editingId = id;
        
        closeHistoryModal();
        
        dateInput.value = t.date;
        formDateDisplay.innerText = formatNiceDate(t.date);
        
        document.getElementById('noteInput').value = t.note || '';
        amountInputRaw.value = t.amount;
        amountInputDisplay.value = formatter.format(t.amount);
        
        switchType(t.type);
        const targetPill = document.querySelector(`.cat-pill[data-val="${t.category}"]`);
        if(targetPill) {
            catPills.forEach(p => p.classList.remove('active'));
            targetPill.classList.add('active');
            categoryInput.value = t.category;
            targetPill.scrollIntoView({ behavior: 'smooth', inline: 'center' });
        }

        document.getElementById('submitBtn').innerText = 'Lưu thay đổi';
        document.getElementById('submitBtn').classList.add('edit-mode');
        document.getElementById('formCard').classList.add('edit-mode');
        document.getElementById('cancelEditBtn').classList.remove('hide');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function triggerDelete(id) {
        if(confirm('Bạn có chắc muốn xóa giao dịch này?')) {
            const t = transactions.find(x => x.id === id);
            if(t && currentUser) {
                db.ref(`users/${currentUser.uid}/transactions/${t.date}/${id}`).remove()
                .then(() => {
                    if(editingId === id) resetFormState(); 
                    showToast('Đã xóa giao dịch');
                }).catch(err => { showToast('Lỗi khi xóa!', 'error'); });
            }
        }
    }

    document.getElementById('cancelEditBtn').addEventListener('click', resetFormState);

    function resetFormState() {
        editingId = null;
        amountInputDisplay.value = ''; amountInputRaw.value = ''; document.getElementById('noteInput').value = '';
        dateInput.value = todayStr; formDateDisplay.innerText = formatNiceDate(todayStr);
        
        document.getElementById('submitBtn').innerText = 'Thêm giao dịch';
        document.getElementById('submitBtn').classList.remove('edit-mode');
        document.getElementById('formCard').classList.remove('edit-mode');
        document.getElementById('cancelEditBtn').classList.add('hide');
        
        switchType('income'); 
    }

    // ==========================================
    // 8. SUBMIT FORM (LƯU LÊN FIREBASE)
    // ==========================================
    document.getElementById('transactionForm').addEventListener('submit', (e) => {
        e.preventDefault();
        
        if(!currentUser) { showToast('Vui lòng đăng nhập!', 'error'); return; }

        const amtStr = amountInputRaw.value;
        if(!amtStr || parseInt(amtStr) < 1000) { alert('Vui lòng nhập số tiền hợp lệ'); return; }
        
        const amt = parseInt(amtStr);
        const cat = categoryInput.value;
        const note = document.getElementById('noteInput').value;
        const date = dateInput.value;
        const type = document.getElementById('typeInput').value;

        const txData = { type, amount: amt, category: cat, note };

        if (editingId) {
            const oldTx = transactions.find(x => x.id === editingId);
            if (oldTx && oldTx.date !== date) {
                db.ref(`users/${currentUser.uid}/transactions/${oldTx.date}/${editingId}`).remove();
                db.ref(`users/${currentUser.uid}/transactions/${date}/${editingId}`).set(txData)
                .then(() => showToast('Đã cập nhật giao dịch'))
                .catch(err => { console.error(err); showToast('Lỗi lưu dữ liệu', 'error'); });
            } else {
                db.ref(`users/${currentUser.uid}/transactions/${date}/${editingId}`).update(txData)
                .then(() => showToast('Đã cập nhật giao dịch'))
                .catch(err => { console.error(err); showToast('Lỗi lưu dữ liệu', 'error'); });
            }
        } else {
            const newId = Date.now();
            db.ref(`users/${currentUser.uid}/transactions/${date}/${newId}`).set(txData)
            .then(() => {
                currentDateLimit = DATES_PER_PAGE; 
                showToast('Thêm thành công!');
            }).catch(err => {
                console.error("Lỗi Firebase:", err); 
                showToast('Lỗi khi lưu dữ liệu!', 'error');
            });
        }
        resetFormState();
    });
</script>
</body>
</html>
